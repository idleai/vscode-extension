version: 2
registries:
  # Dependabot requires a secret reference; its value is the public marker "anonymous".
  idle-app-core:
    type: cargo-registry
    registry: idle-app-core
    url: https://raw.githubusercontent.com/idleai/app-core/cargo-index/
    token: ${{secrets.PUBLIC_CARGO_REGISTRY_TOKEN}}
  idle-editchain:
    type: cargo-registry
    registry: idle-editchain
    url: https://raw.githubusercontent.com/idleai/editchain/cargo-index/
    token: ${{secrets.PUBLIC_CARGO_REGISTRY_TOKEN}}
  idle-host-tools:
    type: cargo-registry
    registry: idle-host-tools
    url: https://raw.githubusercontent.com/idleai/host-tools/cargo-index/
    token: ${{secrets.PUBLIC_CARGO_REGISTRY_TOKEN}}
  idle-web-ui:
    type: cargo-registry
    registry: idle-web-ui
    url: https://raw.githubusercontent.com/idleai/web-ui/cargo-index/
    token: ${{secrets.PUBLIC_CARGO_REGISTRY_TOKEN}}
# Version update PRs are paused; remove the zero limits below to resume.
updates:
  - package-ecosystem: cargo
    open-pull-requests-limit: 0
    registries: "*"
    directory: /
    schedule:
      interval: daily
    # Internal packages are updated together with native archive checksums.
    ignore:
      - dependency-name: "editchain*"
      - dependency-name: "idle-*"
      - dependency-name: "history-geometry"
      - dependency-name: "app-core"
      - dependency-name: "web-ui"
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
