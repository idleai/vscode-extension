name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
        with:
          path: vscode-extension
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/app-core
          ref: 18e9c7d98f87a3a44f98374fa187393221c30572
          path: app-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/web-ui
          ref: 808464f2c2f4c0e5029b3503ce42b3041ffd5ff9
          path: web-ui
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/editchain
          ref: ef6206bb0c80c398102303529129662f74660c21
          path: editchain
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "vscode-extension -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - run: npm ci
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - run: bash scripts/check.sh
      - name: Install Chrome for packaged application checks
        id: chrome
        run: |
          OUTPUT="$(npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/idle-chrome")"
          CHROME_EXECUTABLE="$(printf '%s\n' "$OUTPUT" | tail -n 1 | awk '{print $NF}')"
          test -x "$CHROME_EXECUTABLE"
          echo "path=$CHROME_EXECUTABLE" >> "$GITHUB_OUTPUT"
      - name: Verify packaged webview and native history integration
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: |
          npm run test:webview
          npm run test:assembly
      - uses: actions/upload-artifact@v4
        with:
          name: idle-vscode
          path: vscode-extension/idle.vsix
          if-no-files-found: error
