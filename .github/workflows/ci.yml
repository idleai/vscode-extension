name: CI
on:
  push:
    branches: [main, "acceptance/compute/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      dependency_mode:
        description: Dependency selection
        type: choice
        options: [locked, latest]
        default: locked
  workflow_call:
    inputs:
      dependency_mode:
        description: Use committed selections or explicitly test newer releases
        required: false
        type: string
        default: locked
      revision:
        description: Commit to validate before publication
        required: true
        type: string
      dependencies_artifact:
        description: Prepared dependencies to reuse during release verification
        required: false
        type: string
        default: ''
    outputs:
      dependencies_artifact:
        description: Exact dependencies selected for this CI run
        value: ${{ jobs.dependencies.outputs.artifact_id }}

concurrency:
  group: ci-checks::${{ github.workflow }}::${{ inputs.revision || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.revision == '' && github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  dependencies:
    name: Preflight and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    outputs:
      artifact_id: ${{ steps.save.outputs.artifact-id }}
      windows_dependencies: ${{ steps.scope.outputs.windows_dependencies }}
      native_bindings: ${{ steps.scope.outputs.native_bindings }}
      consumers: ${{ steps.scope.outputs.consumers }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: vscode-extension
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select auxiliary checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_CI: ${{ inputs.revision != '' || inputs.dependency_mode == 'latest' || github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/ci_scope.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - name: Check formatting and CI helpers before compilation
        run: |
          cargo fmt --all -- --check
          python3 -m unittest discover -s scripts -p 'test_release_dependencies.py'
          python3 -m unittest discover -s scripts -p 'test_ci_scope.py'
      - name: Select build dependencies
        if: ${{ !inputs.dependencies_artifact }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDENCY_MODE: ${{ inputs.dependency_mode || 'locked' }}
        run: |
          case "$DEPENDENCY_MODE" in
            locked) python3 scripts/release_dependencies.py locked ;;
            latest) python3 scripts/release_dependencies.py resolve ;;
            *) echo "Unknown dependency selection: $DEPENDENCY_MODE" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@v8
        if: ${{ inputs.dependencies_artifact != '' }}
        with:
          artifact-ids: ${{ inputs.dependencies_artifact }}
          path: vscode-extension/target
      - name: Restore prepared release dependencies
        if: ${{ inputs.dependencies_artifact != '' }}
        run: python3 scripts/release_dependencies.py restore
      - uses: actions/upload-artifact@v7
        id: save
        with:
          name: released-dependencies
          overwrite: true
          path: vscode-extension/target/released-dependencies.json
          if-no-files-found: error

  check:
    needs: dependencies
    env:
      CHROME_VERSION: 156.0.8078.47
      IDLE_RELEASE_INPUTS: ${{ github.workspace }}/vscode-extension/target/released-dependencies.json
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.IDLE_LINUX_RUNNER || github.event_name != 'pull_request' && vars.IDLE_BACKGROUND_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
        with:
          path: vscode-extension
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.dependencies.outputs.artifact_id }}
          path: vscode-extension/target
      - name: Restore this build's dependency selection
        run: python3 scripts/release_dependencies.py restore
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "vscode-extension -> target"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-bindgen@0.2.127
          fallback: none
      - run: npm ci
      - name: Install cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: bash scripts/check.sh
      - name: Install Chrome for packaged application checks
        id: chrome
        run: |
          OUTPUT="$(npx @puppeteer/browsers install chrome@"$CHROME_VERSION" --path "$RUNNER_TOOL_CACHE/idle-chrome")"
          CHROME_EXECUTABLE="$(printf '%s\n' "$OUTPUT" | tail -n 1 | awk '{print $NF}')"
          test -x "$CHROME_EXECUTABLE"
          echo "path=$CHROME_EXECUTABLE" >> "$GITHUB_OUTPUT"
      - name: Verify packaged webview and native history integration
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: |
          npm run test:webview
          npm run test:assembly
      - uses: actions/upload-artifact@v7
        with:
          name: idle-vscode
          path: vscode-extension/idle.vsix
          if-no-files-found: error
      - name: Install desktop VS Code for isolated extension checks
        run: |
          vscode_cache="$RUNNER_TOOL_CACHE/idle-vscode/1.140.0"
          if [[ ! -f "$vscode_cache/.complete" || ! -x "$vscode_cache/VSCode-linux-x64/bin/code" ]]; then
            install_root="$(mktemp -d "$RUNNER_TEMP/idle-vscode.XXXXXX")"
            trap 'rm -rf "$install_root"' EXIT
            curl --fail --location --retry 3 https://update.code.visualstudio.com/1.140.0/linux-x64/stable -o "$install_root/archive.tar.gz"
            tar -xzf "$install_root/archive.tar.gz" -C "$install_root"
            test -x "$install_root/VSCode-linux-x64/bin/code"
            rm "$install_root/archive.tar.gz"
            mkdir -p "$(dirname "$vscode_cache")"
            rm -rf "$vscode_cache"
            mv "$install_root" "$vscode_cache"
            touch "$vscode_cache/.complete"
          fi
      - name: Verify installed VSIX in an isolated VS Code profile
        env:
          VSCODE_BIN: ${{ runner.tool_cache }}/idle-vscode/1.140.0/VSCode-linux-x64/bin/code
        run: npm run test:vscode

  windows_dependencies:
    name: Restore shared dependencies on Windows
    needs: dependencies
    if: needs.dependencies.outputs.windows_dependencies == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    env:
      IDLE_RELEASE_INPUTS: ${{ github.workspace }}/vscode-extension/target/released-dependencies.json
    steps:
      - uses: actions/checkout@v7
        with:
          path: vscode-extension
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.dependencies.outputs.artifact_id }}
          path: vscode-extension/target
      - name: Restore the Linux dependency record
        run: python scripts/release_dependencies.py restore
      - name: Check dependency selection and reuse
        run: python -m unittest discover -s scripts -p test_release_dependencies.py

  compute_acceptance:
    name: Desktop connection to a separate compute machine
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/acceptance/compute/')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IDLE_COMPUTE_TEST_DIR: /tmp/idle-compute-desktop
      VSCODE_BIN: /tmp/idle-compute-vscode/VSCode-linux-x64/bin/code
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: idle-vscode
      - name: Install desktop VS Code
        run: |
          mkdir -p /tmp/idle-compute-vscode
          curl --fail --location --retry 3 https://update.code.visualstudio.com/1.140.0/linux-x64/stable -o /tmp/idle-compute-vscode/archive.tar.gz
          tar -xzf /tmp/idle-compute-vscode/archive.tar.gz -C /tmp/idle-compute-vscode
      - name: Prepare an isolated desktop and public connection request
        run: node scripts/smoke-compute-desktop.cjs prepare idle.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: compute-connection-request
          path: ${{ env.IDLE_COMPUTE_TEST_DIR }}/request
          if-no-files-found: error
          retention-days: 1
      - name: Connect to the approved compute host and restart the desktop
        run: node scripts/smoke-compute-desktop.cjs run
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compute-results
          path: |
            ${{ env.IDLE_COMPUTE_TEST_DIR }}/connect.json
            ${{ env.IDLE_COMPUTE_TEST_DIR }}/restore.json
            ${{ env.IDLE_COMPUTE_TEST_DIR }}/*-progress.jsonl
          if-no-files-found: warn
          retention-days: 1
  required:
    name: CI required
    if: always()
    needs: [dependencies, check, windows_dependencies, compute_acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED_WINDOWS_DEPENDENCIES: ${{ needs.dependencies.outputs.windows_dependencies }}
          SELECTED_COMPUTE_ACCEPTANCE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/acceptance/compute/') }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          failures = {
              name: job["result"] for name, job in needs.items()
              if job["result"] != "success" and not (
                  job["result"] == "skipped"
                  and os.environ.get("SELECTED_" + name.upper()) == "false"
              )
          }
          if failures:
              raise SystemExit(f"Required CI jobs did not succeed: {failures}")
          print("All selected checks passed.")
          PY
