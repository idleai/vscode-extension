name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
        with:
          path: vscode-extension
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/app-core
          ref: a4e4f8bb3ef944c4ac514a064ca3654d4170cad1
          path: app-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/web-ui
          ref: fc73c121538e92f8d5a44957dc4aff827c628821
          path: web-ui
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/editchain
          ref: b1fd8436b4ca4f2a3add85a3bae7388cba089f62
          path: editchain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/codex-evo
          ref: 43358882a44c3e2441866a9395d690b8d61c91c7
          path: codex
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "vscode-extension -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Install and verify portable history runtime
        working-directory: codex/tools/history-runtime
        run: |
          npm ci
          npm test
      - run: npm ci
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - run: bash scripts/check.sh
      - name: Install Chrome for packaged application checks
        id: chrome
        run: |
          OUTPUT="$(npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/idle-chrome")"
          CHROME_EXECUTABLE="$(printf '%s\n' "$OUTPUT" | tail -n 1 | awk '{print $NF}')"
          test -x "$CHROME_EXECUTABLE"
          echo "path=$CHROME_EXECUTABLE" >> "$GITHUB_OUTPUT"
      - name: Verify packaged webview and native history integration
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: |
          npm run test:webview
          npm run test:assembly
      - uses: actions/upload-artifact@v4
        with:
          name: idle-vscode
          path: vscode-extension/idle.vsix
          if-no-files-found: error
