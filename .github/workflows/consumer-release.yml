name: Consumer release
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      dependencies_artifact:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    env:
      IDLE_RELEASE_INPUTS: ${{ github.workspace }}/target/released-dependencies.json
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        if: ${{ inputs.dependencies_artifact != '' }}
        with:
          artifact-ids: ${{ inputs.dependencies_artifact }}
          path: target
      - name: Download recorded release dependencies for a manual retry
        if: ${{ !inputs.dependencies_artifact }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern released-dependencies.json --dir target --clobber
      - name: Restore the tested dependency selection
        run: python3 scripts/release_dependencies.py restore
      - name: Build the compatibility package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/package-consumer.py --tag "$RELEASE_TAG"
      - name: Publish the compatibility package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          (cd releases && sha256sum --check ./*.sha256)
          gh release upload "$RELEASE_TAG" releases/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
