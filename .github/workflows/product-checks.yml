name: Product build checks

on:
  pull_request:
    paths: ['scripts/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check orchestration contracts and syntax
        run: |
          python3 -m unittest discover -s scripts -p 'test_product*.py'
          node --check scripts/smoke-product.cjs
          node --check scripts/smoke-compute-owner.cjs
          bash -n scripts/setup-product-tools.sh scripts/package-product-codex.sh
      - name: Validate workflow definitions
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/product*.yml
